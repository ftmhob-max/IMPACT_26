extend type Query

# ─── Users ────────────────────────────────────────────────────────────────────

type User @table(name: "users", singular: "user", plural: "users") {
  # id mirrors Firebase Auth UID — set explicitly on create
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  email: String! @col(dataType: "text")
  fullName: String @col(dataType: "text")
  # learner | instructor | admin
  role: String! @col(dataType: "text") @default(value: "learner")
  createdAt: Date! @default(expr: "request.time")
}

# ─── Courses ──────────────────────────────────────────────────────────────────

type Course @table(name: "courses", singular: "course", plural: "courses") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  slug: String! @col(dataType: "text")
  title: String! @col(dataType: "text")
  description: String @col(dataType: "text")
  thumbnailUrl: String @col(dataType: "text")
  isPublished: Boolean! @default(value: false)
  createdBy: User!
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type Module @table(name: "modules", singular: "module", plural: "modules") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  course: Course!
  title: String! @col(dataType: "text")
  position: Int!
  createdAt: Date! @default(expr: "request.time")
}

type Lesson @table(name: "lessons", singular: "lesson", plural: "lessons") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  module: Module!
  title: String! @col(dataType: "text")
  position: Int!
  # video | text | quiz
  lessonType: String! @col(dataType: "text")
  # TipTap JSON document stored as text
  contentJson: String @col(dataType: "text")
  # Mux playback ID (not asset ID — never expose asset ID to client)
  videoPlaybackId: String @col(dataType: "text")
  quiz: Quiz
  durationSeconds: Int
  isPublished: Boolean! @default(value: false)
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# ─── Question Bank ────────────────────────────────────────────────────────────

type Question @table(name: "questions", singular: "question", plural: "questions") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  questionText: String! @col(dataType: "text")
  # easy | proficient | expert
  difficulty: String! @col(dataType: "text")
  # math | appraisal | law | philly | admin | ethics
  domain: String! @col(dataType: "text")
  formulaRef: String @col(dataType: "text")
  isMultiselect: Boolean! @default(value: false)
  rationale: String @col(dataType: "text")
  calculation: String @col(dataType: "text")
  sourceRef: String @col(dataType: "text")
  createdBy: User
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# SECURITY: isCorrect and explanation are protected via @auth directives.
# Learner-role tokens cannot query these fields.
# Server-side code uses the Firebase Admin SDK (bypasses all auth rules).
type AnswerChoice @table(name: "answer_choices", singular: "answerChoice", plural: "answerChoices") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  question: Question!
  # A–E
  letter: String! @col(dataType: "char(1)")
  choiceText: String! @col(dataType: "text")
  # Protected: only admin/instructor tokens may read
  isCorrect: Boolean! @default(value: false)
    @auth(expr: "auth.token.role == 'admin' || auth.token.role == 'instructor'")
  # Protected: only returned to browser after question is answered (via API route)
  explanation: String @col(dataType: "text")
    @auth(expr: "auth.token.role == 'admin' || auth.token.role == 'instructor'")
  position: Int!
}

# ─── Quizzes ──────────────────────────────────────────────────────────────────

type Quiz @table(name: "quizzes", singular: "quiz", plural: "quizzes") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  title: String! @col(dataType: "text")
  description: String @col(dataType: "text")
  timeLimitSeconds: Int
  passingScore: Float
  shuffleQuestions: Boolean! @default(value: false)
  shuffleChoices: Boolean! @default(value: false)
  createdBy: User
  createdAt: Date! @default(expr: "request.time")
}

type QuizQuestion @table(name: "quiz_questions", singular: "quizQuestion", plural: "quizQuestions") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  quiz: Quiz!
  question: Question!
  position: Int!
  pointValue: Float! @default(value: 1.0)
}

# ─── Progress ─────────────────────────────────────────────────────────────────

type UserCourseProgress @table(name: "user_course_progress") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  user: User!
  course: Course!
  enrolledAt: Date! @default(expr: "request.time")
  completedAt: Date
  lastAccessedAt: Date
}

type UserLessonProgress @table(name: "user_lesson_progress") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  user: User!
  lesson: Lesson!
  # not_started | in_progress | completed
  status: String! @default(value: "not_started")
  videoPositionSeconds: Int @default(value: 0)
  completedAt: Date
}

# ─── Quiz Attempts ────────────────────────────────────────────────────────────

type QuizAttempt @table(name: "quiz_attempts", singular: "quizAttempt", plural: "quizAttempts") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  user: User!
  quiz: Quiz!
  # in_progress | completed | abandoned
  status: String! @default(value: "in_progress")
  # JSON array of question IDs in shuffled order — stored so resume matches original shuffle
  questionOrder: String! @col(dataType: "text") @default(value: "[]")
  startedAt: Date! @default(expr: "request.time")
  completedAt: Date
  scoreRaw: Float
  scoreMax: Float
  scorePct: Float
  passed: Boolean
}

type QuizResponse @table(name: "quiz_responses", singular: "quizResponse", plural: "quizResponses") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  attempt: QuizAttempt!
  question: Question!
  # JSON array of selected letters e.g. ["A"] or ["A","C"] for multi-select
  selectedLetters: String! @col(dataType: "text") @default(value: "[]")
  isCorrect: Boolean
  pointsEarned: Float
  pointsPossible: Float
  answeredAt: Date
}

# ─── Formula Reference ────────────────────────────────────────────────────────

type FormulaSection @table(name: "formula_sections", singular: "formulaSection", plural: "formulaSections") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  code: String! @col(dataType: "text")
  title: String! @col(dataType: "text")
  position: Int!
}

type Formula @table(name: "formulas", singular: "formula", plural: "formulas") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  section: FormulaSection!
  code: String! @col(dataType: "text")
  name: String! @col(dataType: "text")
  expression: String! @col(dataType: "text")
  notes: String @col(dataType: "text")
  position: Int!
}
