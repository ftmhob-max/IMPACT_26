# ─── Users ────────────────────────────────────────────────────────────────────

type User @table(name: "users", singular: "user", plural: "users") {
  # id mirrors Firebase Auth UID — set explicitly on create
  id: String! @col(name: "id")
  email: String! @col(dataType: "text")
  fullName: String @col(dataType: "text")
  # learner | viewer | instructor | admin
  role: String! @col(dataType: "text") @default(value: "learner")
  createdAt: Date! @default(expr: "request.time")
}

# ─── Courses ──────────────────────────────────────────────────────────────────

type Course @table(name: "courses", singular: "course", plural: "courses", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  slug: String! @col(dataType: "text") @unique
  title: String! @col(dataType: "text")
  description: String @col(dataType: "text")
  thumbnailUrl: String @col(dataType: "text")
  status: String! @col(dataType: "text") @default(value: "draft")
  version: Int! @default(value: 1)
  isPublished: Boolean! @default(value: false)
  createdBy: User!
  updatedBy: User
  publishedAt: Date
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type Module @table(name: "modules", singular: "module", plural: "modules", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  course: Course! @ref
  title: String! @col(dataType: "text")
  description: String @col(dataType: "text")
  # JSON array of objective strings
  learningObjectives: String @col(dataType: "text")
  # JSON array of prerequisite Module UUIDs
  prerequisiteModuleIds: String @col(dataType: "text")
  position: Int!
  version: Int! @default(value: 1)
  status: String! @col(dataType: "text") @default(value: "draft")
  createdAt: Date! @default(expr: "request.time")
}

type Lesson @table(name: "lessons", singular: "lesson", plural: "lessons", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  module: Module! @ref
  title: String! @col(dataType: "text")
  position: Int!
  # video | text | quiz | source
  lessonType: String! @col(dataType: "text")
  # TipTap JSON document stored as text
  contentJson: String @col(dataType: "text")
  # Mux playback ID (not asset ID — never expose asset ID to client)
  videoPlaybackId: String @col(dataType: "text")
  # External video URL (YouTube, Vimeo, Loom, Google Drive, Wistia, etc.)
  videoUrl: String @col(dataType: "text")
  quiz: Quiz
  sourceMaterial: SourceMaterial
  durationSeconds: Int
  status: String! @col(dataType: "text") @default(value: "draft")
  version: Int! @default(value: 1)
  isPublished: Boolean! @default(value: false)
  updatedBy: User
  publishedAt: Date
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# ─── Source Materials / Ingestion ─────────────────────────────────────────────

type SourceMaterial @table(name: "source_materials", singular: "sourceMaterial", plural: "sourceMaterials", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  title: String! @col(dataType: "text")
  fileName: String! @col(dataType: "text")
  fileType: String! @col(dataType: "text")
  folder: SourceMaterialFolder
  storagePath: String! @col(dataType: "text")
  downloadUrl: String @col(dataType: "text")
  extractedText: String @col(dataType: "text")
  metadataJson: String @col(dataType: "text")
  status: String! @col(dataType: "text") @default(value: "uploaded")
  uploadedBy: User
  starred: Boolean! @default(value: false)
  archivedAt: Date
  trashedAt: Date
  reviewStatus: String! @col(dataType: "text") @default(value: "unreviewed")
  visibility: String! @col(dataType: "text") @default(value: "admin")
  duplicateOf: SourceMaterial
  lastActivityAt: Date
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type SourceMaterialFolder @table(name: "source_material_folders", singular: "sourceMaterialFolder", plural: "sourceMaterialFolders", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  name: String! @col(dataType: "text")
  parentFolder: SourceMaterialFolder
  folderType: String! @col(dataType: "text") @default(value: "custom")
  course: Course
  lesson: Lesson
  createdBy: User
  archivedAt: Date
  trashedAt: Date
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type SourceMaterialTag @table(name: "source_material_tags", singular: "sourceMaterialTag", plural: "sourceMaterialTags", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  name: String! @col(dataType: "text")
  color: String @col(dataType: "text")
  createdBy: User
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type SourceMaterialTagAssignment @table(name: "source_material_tag_assignments", singular: "sourceMaterialTagAssignment", plural: "sourceMaterialTagAssignments", key: ["sourceMaterial", "tag"]) {
  sourceMaterial: SourceMaterial! @ref
  tag: SourceMaterialTag! @ref
  createdAt: Date! @default(expr: "request.time")
}

type SourceMaterialActivity @table(name: "source_material_activity", singular: "sourceMaterialActivity", plural: "sourceMaterialActivities", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  sourceMaterial: SourceMaterial
  folder: SourceMaterialFolder
  actor: User
  activityType: String! @col(dataType: "text")
  message: String @col(dataType: "text")
  metadataJson: String @col(dataType: "text")
  createdAt: Date! @default(expr: "request.time")
}

type IngestionJob @table(name: "ingestion_jobs", singular: "ingestionJob", plural: "ingestionJobs", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  sourceMaterial: SourceMaterial! @ref
  status: String! @col(dataType: "text") @default(value: "queued")
  parser: String! @col(dataType: "text")
  extractedCharacters: Int! @default(value: 0)
  errorMessage: String @col(dataType: "text")
  createdAt: Date! @default(expr: "request.time")
  completedAt: Date
}

type ContentSourceLink @table(name: "content_source_links", singular: "contentSourceLink", plural: "contentSourceLinks", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  sourceMaterial: SourceMaterial! @ref
  course: Course
  lesson: Lesson
  question: Question
  referenceLabel: String @col(dataType: "text")
  createdAt: Date! @default(expr: "request.time")
}

# ─── Question Bank ────────────────────────────────────────────────────────────

type Question @table(name: "questions", singular: "question", plural: "questions", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  questionText: String! @col(dataType: "text")
  # easy | proficient | expert
  difficulty: String! @col(dataType: "text")
  # math | appraisal | law | philly | admin | ethics
  domain: String! @col(dataType: "text")
  formulaRef: String @col(dataType: "text")
  questionType: String! @col(dataType: "text") @default(value: "multiple_choice")
  topicTags: String @col(dataType: "text")
  version: Int! @default(value: 1)
  status: String! @col(dataType: "text") @default(value: "draft")
  isMultiselect: Boolean! @default(value: false)
  rationale: String @col(dataType: "text")
  calculation: String @col(dataType: "text")
  sourceRef: String @col(dataType: "text")
  createdBy: User
  updatedBy: User
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# SECURITY: isCorrect and explanation are protected via @auth directives.
# Learner-role tokens cannot query these fields.
# Server-side code uses the Firebase Admin SDK (bypasses all auth rules).
type AnswerChoice @table(name: "answer_choices", singular: "answerChoice", plural: "answerChoices") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  question: Question! @ref
  # A–E
  letter: String! @col(dataType: "char(1)")
  choiceText: String! @col(dataType: "text")
  # Protected: only admin/instructor tokens may read
  isCorrect: Boolean! @default(value: false)
  # Protected: only returned to browser after question is answered (via API route)
  explanation: String @col(dataType: "text")
  position: Int!
}

# ─── Quizzes ──────────────────────────────────────────────────────────────────

type Quiz @table(name: "quizzes", singular: "quiz", plural: "quizzes", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  title: String! @col(dataType: "text")
  description: String @col(dataType: "text")
  timeLimitSeconds: Int
  passingScore: Float
  shuffleQuestions: Boolean! @default(value: false)
  shuffleChoices: Boolean! @default(value: false)
  status: String! @col(dataType: "text") @default(value: "draft")
  calculatorSettingsJson: String @col(dataType: "text")
  version: Int! @default(value: 1)
  createdBy: User
  updatedBy: User
  publishedAt: Date
  createdAt: Date! @default(expr: "request.time")
}

type QuizQuestion @table(name: "quiz_questions", key: ["quiz", "question"]) {
  quiz: Quiz! @ref
  question: Question!
  position: Int!
  pointValue: Float! @default(value: 1.0)
}

# ─── Progress ─────────────────────────────────────────────────────────────────

type UserCourseProgress @table(name: "user_course_progress", key: ["user", "course"]) {
  user: User!
  course: Course!
  enrolledAt: Date! @default(expr: "request.time")
  completedAt: Date
  lastAccessedAt: Date
}

type UserLessonProgress @table(name: "user_lesson_progress", key: ["user", "lesson"]) {
  user: User!
  lesson: Lesson!
  # not_started | in_progress | completed
  status: String! @default(value: "not_started")
  videoPositionSeconds: Int @default(value: 0)
  completedAt: Date
}

# ─── Quiz Attempts ────────────────────────────────────────────────────────────

type QuizAttempt @table(name: "quiz_attempts", singular: "quizAttempt", plural: "quizAttempts") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  user: User!
  quiz: Quiz!
  # in_progress | completed | abandoned
  status: String! @default(value: "in_progress")
  # JSON array of question IDs in shuffled order — stored so resume matches original shuffle
  questionOrder: String! @col(dataType: "text") @default(value: "[]")
  startedAt: Date! @default(expr: "request.time")
  completedAt: Date
  scoreRaw: Float
  scoreMax: Float
  scorePct: Float
  passed: Boolean
}

type QuizResponse @table(name: "quiz_responses", singular: "quizResponse", plural: "quizResponses", key: ["attempt", "question"]) {
  attempt: QuizAttempt! @ref
  question: Question!
  # JSON array of selected letters e.g. ["A"] or ["A","C"] for multi-select
  selectedLetters: String! @col(dataType: "text") @default(value: "[]")
  isCorrect: Boolean
  pointsEarned: Float
  pointsPossible: Float
  answeredAt: Date
}

# ─── Lesson Version History ───────────────────────────────────────────────────

type LessonVersion @table(name: "lesson_versions", singular: "lessonVersion", plural: "lessonVersions", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  lesson: Lesson! @ref
  # Snapshot of contentJson at time of save
  contentJson: String @col(dataType: "text")
  videoPlaybackId: String @col(dataType: "text")
  versionNote: String @col(dataType: "text")
  createdBy: User!
  createdAt: Date! @default(expr: "request.time")
}

# ─── Formula Reference ────────────────────────────────────────────────────────

type FormulaSection @table(name: "formula_sections", singular: "formulaSection", plural: "formulaSections", key: ["id"]) {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  code: String! @col(dataType: "text")
  title: String! @col(dataType: "text")
  position: Int!
}

type Formula @table(name: "formulas", singular: "formula", plural: "formulas") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  section: FormulaSection! @ref
  code: String! @col(dataType: "text")
  name: String! @col(dataType: "text")
  expression: String! @col(dataType: "text")
  notes: String @col(dataType: "text")
  position: Int!
  calcMetaJson: String @col(dataType: "text")
  examplesJson: String @col(dataType: "text")
}

# ─── Glossary ─────────────────────────────────────────────────────────────────

type GlossaryTerm @table(name: "glossary_terms", singular: "glossaryTerm", plural: "glossaryTerms") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  term: String! @col(dataType: "text")
  definition: String! @col(dataType: "text")
  fullDefinition: String @col(dataType: "text")
  domain: String @col(dataType: "text")
  category: String @col(dataType: "text")
  example: String @col(dataType: "text")
  # JSON-serialised string array — same pattern as topicTags on Question
  relatedTerms: String @col(dataType: "text")
  isPublished: Boolean! @default(value: false)
  sourceDocument: String @col(dataType: "text")
  createdBy: User @ref
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type GlossaryNote @table(name: "glossary_notes", singular: "glossaryNote", plural: "glossaryNotes") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  user: User! @ref
  term: GlossaryTerm! @ref
  note: String! @col(dataType: "text")
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type LessonNote @table(name: "lesson_notes", singular: "lessonNote", plural: "lessonNotes") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  user: User! @ref
  lessonId: UUID @col(name: "lesson_id")
  lessonTitle: String @col(dataType: "text")
  content: String! @col(dataType: "text")
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# ─── Favorites ────────────────────────────────────────────────────────────────

type UserFavorite @table(name: "user_favorites", singular: "userFavorite", plural: "userFavorites", key: ["user", "itemType", "itemId"]) {
  user: User!
  itemType: String! @col(dataType: "text") # "formula" | "glossary"
  itemId: String! @col(dataType: "text")
  createdAt: Date! @default(expr: "request.time")
}

# ─── Custom Domains ───────────────────────────────────────────────────────────

type CustomDomain @table(name: "custom_domains", singular: "customDomain", plural: "customDomains") {
  id: UUID! @col(name: "id") @default(expr: "uuidV4()")
  name: String! @col(dataType: "text")
  createdBy: User @ref
  createdAt: Date! @default(expr: "request.time")
}

