# ─── Learner queries (no sensitive fields) ───────────────────────────────────

# Get published courses for the catalog
query ListPublishedCourses @auth(level: NO_ACCESS) {
  courses(where: { isPublished: { eq: true } }, orderBy: { createdAt: DESC }) {
    id
    slug
    title
    description
    thumbnailUrl
    createdBy { fullName }
  }
}

# Get a course with its full module/lesson tree (learner view)
query GetCourseBySlug($slug: String!) @auth(level: NO_ACCESS) {
  courses(where: { slug: { eq: $slug } }, limit: 1) {
    id
    slug
    title
    description
    thumbnailUrl
    modules_on_course(orderBy: { position: ASC }) {
      id
      title
      position
      prerequisiteModuleIds
      lessons_on_module(orderBy: { position: ASC }, where: { isPublished: { eq: true } }) {
        id
        title
        position
        lessonType
        durationSeconds
        videoPlaybackId
        videoUrl
        quiz { id }
      }
    }
  }
}

# Get a single lesson (learner view — no isCorrect on choices)
query GetLesson($id: UUID!) @auth(level: NO_ACCESS) {
  lesson(id: $id) {
    id
    title
    lessonType
    contentJson
    videoPlaybackId
    videoUrl
    durationSeconds
    quiz {
      id
      title
      timeLimitSeconds
      shuffleQuestions
      shuffleChoices
    }
    module {
      course {
        slug
        title
      }
    }
  }
}

# Get quiz questions with choices — OMITS isCorrect and explanation
# (those fields blocked by @auth for learner tokens)
query GetQuizQuestions($quizId: UUID!) @auth(level: NO_ACCESS) {
  quizQuestions(
    where: { quiz: { id: { eq: $quizId } } }
    orderBy: { position: ASC }
  ) {
    position
    pointValue
    question {
      id
      questionText
      difficulty
      domain
      formulaRef
      isMultiselect
      answerChoices_on_question(orderBy: { position: ASC }) {
        id
        letter
        choiceText
        position
        # isCorrect: blocked for learner role by @auth directive in schema
        # explanation: blocked for learner role by @auth directive in schema
      }
    }
  }
}

# Get a user's in-progress attempt for a quiz (for session resume)
query GetInProgressAttempt($userId: String!, $quizId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempts(
    where: {
      user: { id: { eq: $userId } }
      quiz: { id: { eq: $quizId } }
      status: { eq: "in_progress" }
    }
    limit: 1
  ) {
    id
    status
    questionOrder
    startedAt
    quiz { timeLimitSeconds }
    quizResponses_on_attempt {
      question { id }
      selectedLetters
      isCorrect
      pointsEarned
      pointsPossible
      answeredAt
    }
  }
}

# Get learner progress for all lessons in a course
query GetUserCourseProgress($userId: String!, $courseId: UUID!) @auth(level: NO_ACCESS) {
  userLessonProgresses(
    where: {
      user: { id: { eq: $userId } }
      lesson: { module: { course: { id: { eq: $courseId } } } }
    }
  ) {
    lesson { id }
    status
    videoPositionSeconds
    completedAt
  }
}

# Get a single lesson's progress record for a user
query GetLessonProgress($userId: String!, $lessonId: UUID!) @auth(level: NO_ACCESS) {
  userLessonProgresses(
    where: { user: { id: { eq: $userId } }, lesson: { id: { eq: $lessonId } } }
    limit: 1
  ) {
    status
    videoPositionSeconds
    completedAt
  }
}

# Get enrollment status + all lesson progress for a user in a course
query GetUserCourseProgressFull($userId: String!, $courseId: UUID!) @auth(level: NO_ACCESS) {
  userCourseProgress: userCourseProgresses(
    where: { user: { id: { eq: $userId } }, course: { id: { eq: $courseId } } }
    limit: 1
  ) {
    enrolledAt
  }
  userLessonProgresses(
    where: {
      user: { id: { eq: $userId } }
      lesson: { module: { course: { id: { eq: $courseId } } } }
    }
  ) {
    lesson { id }
    status
    videoPositionSeconds
    completedAt
  }
}

# Get a lightweight summary of all lesson progress records for a user (for Study Rhythm sidebar)
query GetUserLessonProgressSummary($userId: String!) @auth(level: NO_ACCESS) {
  userLessonProgresses(
    where: { user: { id: { eq: $userId } } }
  ) {
    status
  }
}

# Get all quiz attempts for a user (attempt history)
query GetUserAttemptHistory($userId: String!) @auth(level: NO_ACCESS) {
  quizAttempts(
    where: { user: { id: { eq: $userId } }, status: { eq: "completed" } }
    orderBy: { completedAt: DESC }
  ) {
    id
    quiz { id title }
    scorePct
    passed
    completedAt
  }
}

# Get completed attempt with full response detail (results page)
query GetAttemptResults($attemptId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempt(id: $attemptId) {
    id
    status
    scoreRaw
    scoreMax
    scorePct
    passed
    startedAt
    completedAt
    quiz { title passingScore }
    quizResponses_on_attempt(orderBy: { answeredAt: ASC }) {
      question {
        id
        questionText
        difficulty
        domain
        formulaRef
        rationale
        calculation
        sourceRef
      }
      selectedLetters
      isCorrect
      pointsEarned
      pointsPossible
    }
  }
}

# Get formula reference index (public — no auth required)
query GetFormulaSections @auth(level: NO_ACCESS) {
  formulaSections(orderBy: { position: ASC }) {
    id
    code
    title
    position
    formulas_on_section(orderBy: { position: ASC }) {
      id
      code
      name
      expression
      notes
      calcMetaJson
    }
  }
}

# Get all completed attempts with per-question responses for a user (domain breakdown + history)
query GetUserProgressDetails($userId: String!) @auth(level: NO_ACCESS) {
  quizAttempts(
    where: { user: { id: { eq: $userId } }, status: { eq: "completed" } }
    orderBy: { completedAt: DESC }
  ) {
    id
    quiz { id title passingScore }
    scorePct
    scoreRaw
    scoreMax
    passed
    startedAt
    completedAt
    quizResponses_on_attempt {
      isCorrect
      pointsEarned
      pointsPossible
      question { domain }
    }
  }
}

# List all quizzes — admin/script use only (admin token bypasses NO_ACCESS)
query ListAdminQuizzes @auth(level: NO_ACCESS) {
  quizzes(orderBy: { createdAt: ASC }) {
    id
    title
    description
    status
    passingScore
    timeLimitSeconds
    shuffleQuestions
    shuffleChoices
    calculatorSettingsJson
    createdAt
  }
}

# Get position count of questions in a quiz (for append position)
query GetQuizQuestionCount($quizId: UUID!) @auth(level: NO_ACCESS) {
  quizQuestions(where: { quiz: { id: { eq: $quizId } } }) {
    position
  }
}

# ─── Server-only queries (NO_ACCESS — called via admin token from API routes) ──

query GetQuizQuestionsAdmin($quizId: UUID!) @auth(level: NO_ACCESS) {
  quiz(id: $quizId) {
    id
    title
    timeLimitSeconds
    shuffleQuestions
    shuffleChoices
  }
  quizQuestions(
    where: { quiz: { id: { eq: $quizId } } }
    orderBy: { position: ASC }
  ) {
    position
    pointValue
    question {
      id
      questionText
      difficulty
      domain
      formulaRef
      isMultiselect
      answerChoices_on_question(orderBy: { position: ASC }) {
        id
        letter
        choiceText
        isCorrect
        explanation
        position
      }
    }
  }
}

query GetAttemptForEvaluation($attemptId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempt(id: $attemptId) {
    id
    status
    questionOrder
    user { id }
    quiz { id }
    quizResponses_on_attempt {
      question { id }
      isCorrect
    }
  }
}

query GetQuestionWithAnswers($questionId: UUID!) @auth(level: NO_ACCESS) {
  question(id: $questionId) {
    id
    questionText
    difficulty
    domain
    formulaRef
    isMultiselect
    rationale
    calculation
    sourceRef
    answerChoices_on_question(orderBy: { position: ASC }) {
      id
      letter
      choiceText
      isCorrect
      explanation
      position
    }
  }
}

query GetQuizQuestionPointValue($quizId: UUID!, $questionId: UUID!) @auth(level: NO_ACCESS) {
  quizQuestions(
    where: { quiz: { id: { eq: $quizId } }, question: { id: { eq: $questionId } } }
    limit: 1
  ) {
    pointValue
  }
}

query GetAttemptForCompletion($attemptId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempt(id: $attemptId) {
    id
    status
    user { id }
    quiz { id passingScore }
    quizResponses_on_attempt {
      pointsEarned
      pointsPossible
      question { domain }
    }
  }
}

query GetAttemptOwner($attemptId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempt(id: $attemptId) {
    id
    user { id }
  }
}

# ─── Admin queries ─────────────────────────────────────────────────────────────

# Get all questions for admin question bank (includes sensitive fields)
query AdminListQuestions @auth(level: NO_ACCESS) {
  questions(orderBy: { createdAt: DESC }, limit: 500) {
    id
    questionText
    questionType
    difficulty
    domain
    formulaRef
    topicTags
    status
    version
    isMultiselect
    rationale
    calculation
    sourceRef
    createdAt
    answerChoices_on_question(orderBy: { position: ASC }) {
      id
      letter
      choiceText
      isCorrect
      explanation
      position
    }
  }
}

# Lightweight question list for question bank table (no answer choices, paginated)
query AdminListQuestionsPage($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  questions(orderBy: { createdAt: DESC }, limit: $limit, offset: $offset) {
    id
    questionText
    questionType
    difficulty
    domain
    formulaRef
    topicTags
    status
    version
    isMultiselect
    createdAt
  }
}

# Count of all questions (for pagination total)
query AdminCountQuestions @auth(level: NO_ACCESS) {
  questions {
    id
  }
}

query AdminListQuizQuestionUsage @auth(level: NO_ACCESS) {
  quizQuestions {
    quiz { id title }
    question { id }
  }
  lessons(where: { lessonType: { eq: "quiz" } }) {
    id
    title
    quiz { id }
    module {
      id
      title
    }
  }
}

query AdminListCourses @auth(level: NO_ACCESS) {
  courses(orderBy: { updatedAt: DESC }) {
    id
    slug
    title
    description
    thumbnailUrl
    status
    version
    isPublished
    publishedAt
    createdAt
    updatedAt
    createdBy { id email fullName }
    modules_on_course(orderBy: { position: ASC }) {
      id
      title
      description
      learningObjectives
      prerequisiteModuleIds
      position
      status
      lessons_on_module(orderBy: { position: ASC }) {
        id
        title
        position
        lessonType
        status
        isPublished
        durationSeconds
        videoPlaybackId
        videoUrl
        contentJson
        quiz { id }
      }
    }
  }
}

# Get lesson version history
query GetLessonVersions($lessonId: UUID!) @auth(level: NO_ACCESS) {
  lessonVersions(
    where: { lesson: { id: { eq: $lessonId } } }
    orderBy: { createdAt: DESC }
  ) {
    id
    contentJson
    videoPlaybackId
    versionNote
    createdAt
    createdBy { id email fullName }
  }
}

query AdminListSourceMaterialsRich @auth(level: NO_ACCESS) {
  sourceMaterials(orderBy: { createdAt: DESC }) {
    id
    title
    fileName
    fileType
    folder {
      id
      name
      folderType
      parentFolder { id name }
      course { id title }
      lesson { id title }
      archivedAt
      trashedAt
      createdAt
      updatedAt
    }
    storagePath
    downloadUrl
    extractedText
    metadataJson
    status
    starred
    archivedAt
    trashedAt
    reviewStatus
    visibility
    duplicateOf { id title }
    lastActivityAt
    createdAt
    updatedAt
    uploadedBy { id email fullName }
    sourceMaterialTagAssignments_on_sourceMaterial(orderBy: { createdAt: DESC }) {
      id
      tag { id name color }
    }
    sourceMaterialActivities_on_sourceMaterial(orderBy: { createdAt: DESC }, limit: 20) {
      id
      activityType
      message
      metadataJson
      createdAt
      actor { id email fullName }
    }
    ingestionJobs_on_sourceMaterial(orderBy: { createdAt: DESC }) {
      id
      status
      parser
      extractedCharacters
      errorMessage
      createdAt
      completedAt
    }
    contentSourceLinks_on_sourceMaterial(orderBy: { createdAt: DESC }) {
      id
      referenceLabel
      createdAt
      course { id title }
      lesson {
        id
        title
        module {
          id
          title
          course { id title }
        }
      }
      question { id questionText domain difficulty }
    }
  }
}

query AdminListSourceMaterials @auth(level: NO_ACCESS) {
