# Backend Data Connect operations: dataconnect/connector/queries.gql
# ─── Learner queries (no sensitive fields) ───────────────────────────────────

# Get the published catalog tree without learner progress for signed-out views.
query ListPublishedCourses @auth(level: NO_ACCESS) {
  courses(where: { isPublished: { eq: true } }, orderBy: { createdAt: DESC }) {
    id
    slug
    title
    description
    thumbnailUrl
    publishedAt
    modules_on_course(orderBy: { position: ASC }) {
      id
      title
      position
      lessons_on_module(
        orderBy: { position: ASC }
        where: { isPublished: { eq: true } }
      ) {
        id
        title
        position
        lessonType
        durationSeconds
      }
    }
  }
}

# Get the published catalog and the requesting learner's related progress in
# one server-only request. Metrics are derived in the typed learner service.
query GetLearnerCatalog($userId: String!) @auth(level: NO_ACCESS) {
  courses(where: { isPublished: { eq: true } }, orderBy: { createdAt: DESC }) {
    id
    slug
    title
    description
    thumbnailUrl
    publishedAt
    modules_on_course(orderBy: { position: ASC }) {
      id
      title
      position
      lessons_on_module(
        orderBy: { position: ASC }
        where: { isPublished: { eq: true } }
      ) {
        id
        title
        position
        lessonType
        durationSeconds
      }
    }
  }
  userCourseProgresses(where: { user: { id: { eq: $userId } } }) {
    course { id }
    enrolledAt
    lastAccessedAt
    completedAt
  }
  userLessonProgresses(where: { user: { id: { eq: $userId } } }) {
    lesson { id }
    status
    videoPositionSeconds
    completedAt
  }
}

# Owner-scoped learner identity used for certificate display.
query GetLearnerProfile($userId: String!) @auth(level: NO_ACCESS) {
  users(where: { id: { eq: $userId } }, limit: 1) {
    fullName
    email
  }
}

# Get a course with its full module/lesson tree (learner view)
query GetCourseBySlug($slug: String!) @auth(level: NO_ACCESS) {
  courses(where: { slug: { eq: $slug } }, limit: 1) {
    id
    slug
    title
    description
    thumbnailUrl
    modules_on_course(orderBy: { position: ASC }) {
      id
      title
      position
      prerequisiteModuleIds
      lessons_on_module(orderBy: { position: ASC }, where: { isPublished: { eq: true } }) {
        id
        title
        position
        lessonType
        durationSeconds
        videoPlaybackId
        videoUrl
        quiz { id }
      }
    }
  }
}

# Published-only course lookup for learner certificate eligibility.
query GetPublishedCourseBySlug($slug: String!) @auth(level: NO_ACCESS) {
  courses(
    where: { slug: { eq: $slug }, isPublished: { eq: true } }
    limit: 1
  ) {
    id
    slug
    title
    isPublished
    modules_on_course(orderBy: { position: ASC }) {
      lessons_on_module(
        orderBy: { position: ASC }
        where: { isPublished: { eq: true } }
      ) {
        id
      }
    }
  }
}

# Get a single lesson (learner view — no isCorrect on choices)
query GetLesson($id: UUID!) @auth(level: NO_ACCESS) {
  lesson(id: $id) {
    id
    title
    lessonType
    contentJson
    videoPlaybackId
    videoUrl
    durationSeconds
    quiz {
      id
      title
      description
      timeLimitSeconds
      passingScore
      shuffleQuestions
      shuffleChoices
      calculatorSettingsJson
      status
      publishedAt
    }
    sourceMaterial { id }
    module {
      course {
        slug
        title
      }
    }
  }
}

# Published assessment index for learner quiz discovery.
query ListPublishedQuizzes @auth(level: NO_ACCESS) {
  quizzes(where: { status: { eq: "published" } }, orderBy: { publishedAt: DESC }) {
    id
    title
    description
    timeLimitSeconds
    passingScore
    shuffleQuestions
    shuffleChoices
    calculatorSettingsJson
    publishedAt
    quizQuestions_on_quiz(orderBy: { position: ASC }, limit: 1000) {
      position
      pointValue
      question { id domain difficulty }
    }
  }
}

# Lightweight quiz metadata plus question weights. Learner lesson pages do not
# fetch cohort attempts or answer keys to describe an assessment.
query GetQuizSummary($quizId: UUID!) @auth(level: NO_ACCESS) {
  quiz(id: $quizId) {
    id
    title
    description
    timeLimitSeconds
    passingScore
    status
    publishedAt
  }
  quizQuestions(
    where: { quiz: { id: { eq: $quizId } } }
    orderBy: { position: ASC }
  ) {
    position
    pointValue
    question { id domain difficulty }
  }
}

# Server-only review payload. Correct answers remain behind this NO_ACCESS
# operation and must only be returned after API-layer ownership checks.
query GetAttemptReview($attemptId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempt(id: $attemptId) {
    id
    status
    questionOrder
    scoreRaw
    scoreMax
    scorePct
    passed
    startedAt
    completedAt
    user { id }
    quiz {
      id
      title
      passingScore
      quizQuestions_on_quiz(orderBy: { position: ASC }) {
        position
        pointValue
        question {
          id
          questionText
          difficulty
          domain
          formulaRef
          rationale
          calculation
          sourceRef
          answerChoices_on_question(orderBy: { position: ASC }) {
            id
            letter
            choiceText
            isCorrect
            explanation
            position
          }
        }
      }
    }
    quizResponses_on_attempt(orderBy: { answeredAt: ASC }) {
      selectedLetters
      isCorrect
      pointsEarned
      pointsPossible
      answeredAt
      question {
        id
        questionText
        difficulty
        domain
        formulaRef
        rationale
        calculation
        sourceRef
        answerChoices_on_question(orderBy: { position: ASC }) {
          id
          letter
          choiceText
          isCorrect
          explanation
          position
        }
      }
    }
  }
}

# Learner-visible source library. Archived or trashed records are excluded at
# the operation boundary so callers cannot accidentally surface stale assets.
query ListLearnerSourceMaterials @auth(level: NO_ACCESS) {
  sourceMaterials(
    where: {
      visibility: { eq: "learner" }
      archivedAt: { isNull: true }
      trashedAt: { isNull: true }
    }
    orderBy: { updatedAt: DESC }
  ) {
    id
    title
    fileName
    fileType
    metadataJson
    status
    reviewStatus
    visibility
    archivedAt
    trashedAt
    createdAt
    updatedAt
    folder { id name folderType }
    sourceMaterialTagAssignments_on_sourceMaterial {
      tag { id name color }
    }
  }
}

# Access-sensitive fields are isolated to a single material lookup. The route
# authorizes learner visibility or an attachment to a published lesson before
# reading storagePath; course-only and question-only links do not grant access.
query GetLearnerSourceMaterialAccess($materialId: UUID!) @auth(level: NO_ACCESS) {
  sourceMaterials(
    where: {
      id: { eq: $materialId }
      archivedAt: { isNull: true }
      trashedAt: { isNull: true }
    }
    limit: 1
  ) {
    id
    title
    fileName
    fileType
    storagePath
    downloadUrl
    status
    visibility
    metadataJson
    archivedAt
    trashedAt
    updatedAt
    lessons_on_sourceMaterial {
      id
      status
      isPublished
    }
    contentSourceLinks_on_sourceMaterial {
      lesson {
        id
        status
        isPublished
      }
    }
  }
}

# Fetch quiz metadata (status, glossaryEnabled) for start-route visibility check
query GetQuizById($quizId: UUID!) @auth(level: NO_ACCESS) {
  quiz(id: $quizId) {
    id
    status
  }
}

# Get quiz questions with choices — explicitly OMITS isCorrect and explanation.
# Field comments are not authorization; this NO_ACCESS operation is server-only.
query GetQuizQuestions($quizId: UUID!) @auth(level: NO_ACCESS) {
  quizQuestions(
    where: { quiz: { id: { eq: $quizId } } }
    orderBy: { position: ASC }
  ) {
    position
    pointValue
    question {
      id
      questionText
      difficulty
      domain
      formulaRef
      isMultiselect
      answerChoices_on_question(orderBy: { position: ASC }) {
        id
        letter
        choiceText
        position
        # isCorrect and explanation intentionally omitted from this learner payload
      }
    }
  }
}

# Get a user's in-progress attempt for a quiz (for session resume)
query GetInProgressAttempt($userId: String!, $quizId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempts(
    where: {
      user: { id: { eq: $userId } }
      quiz: { id: { eq: $quizId } }
      status: { eq: "in_progress" }
    }
    limit: 1
  ) {
    id
    status
    questionOrder
    startedAt
    quiz { timeLimitSeconds }
    quizResponses_on_attempt {
      question { id }
      selectedLetters
      isCorrect
      pointsEarned
      pointsPossible
      answeredAt
    }
  }
}

# Get learner progress for all lessons in a course
query GetUserCourseProgress($userId: String!, $courseId: UUID!) @auth(level: NO_ACCESS) {
  userLessonProgresses(
    where: {
      user: { id: { eq: $userId } }
      lesson: { module: { course: { id: { eq: $courseId } } } }
    }
  ) {
    lesson { id }
    status
    videoPositionSeconds
    completedAt
  }
}

# Get a single lesson's progress record for a user
query GetLessonProgress($userId: String!, $lessonId: UUID!) @auth(level: NO_ACCESS) {
  userLessonProgresses(
    where: { user: { id: { eq: $userId } }, lesson: { id: { eq: $lessonId } } }
    limit: 1
  ) {
    status
    videoPositionSeconds
    completedAt
  }
}

# Get enrollment status + all lesson progress for a user in a course
query GetUserCourseProgressFull($userId: String!, $courseId: UUID!) @auth(level: NO_ACCESS) {
  userCourseProgress: userCourseProgresses(
    where: { user: { id: { eq: $userId } }, course: { id: { eq: $courseId } } }
    limit: 1
  ) {
    enrolledAt
    completedAt
  }
  userLessonProgresses(
    where: {
      user: { id: { eq: $userId } }
      lesson: { module: { course: { id: { eq: $courseId } } } }
    }
  ) {
    lesson { id }
    status
    videoPositionSeconds
    completedAt
  }
}

# Get a lightweight summary of all lesson progress records for a user (for Study Rhythm sidebar)
query GetUserLessonProgressSummary($userId: String!) @auth(level: NO_ACCESS) {
  userLessonProgresses(
    where: { user: { id: { eq: $userId } } }
  ) {
    status
  }
}

# Get all quiz attempts for a user (attempt history)
query GetUserAttemptHistory($userId: String!) @auth(level: NO_ACCESS) {
  quizAttempts(
    where: { user: { id: { eq: $userId } }, status: { eq: "completed" } }
    orderBy: { completedAt: DESC }
    limit: 500
  ) {
    id
    quiz { id title }
    scorePct
    passed
    completedAt
  }
}

# UTC daily activity history plus bounded legacy activity sources used to
# backfill study streaks without requiring a migration.
query GetUserActivityHistory($userId: String!) @auth(level: NO_ACCESS) {
  dailyActivities(
    where: { user: { id: { eq: $userId } } }
    orderBy: { activityDate: DESC }
    limit: 1000
  ) {
    activityDate
    lastActivityAt
  }
  completedAttempts: quizAttempts(
    where: { user: { id: { eq: $userId } }, status: { eq: "completed" } }
    orderBy: { completedAt: DESC }
    limit: 500
  ) {
    completedAt
  }
  completedLessons: userLessonProgresses(
    where: { user: { id: { eq: $userId } }, status: { eq: "completed" } }
    orderBy: { completedAt: DESC }
    limit: 1000
  ) {
    completedAt
  }
  lessonNoteActivity: lessonNotes(
    where: { user: { id: { eq: $userId } } }
    orderBy: { updatedAt: DESC }
    limit: 500
  ) {
    createdAt
    updatedAt
  }
  glossaryNoteActivity: glossaryNotes(
    where: { user: { id: { eq: $userId } } }
    orderBy: { updatedAt: DESC }
    limit: 500
  ) {
    createdAt
    updatedAt
  }
}

# Get completed attempt with full response detail (results page)
