# ─── Admin queries ─────────────────────────────────────────────────────────────

# Get all questions for admin question bank (includes sensitive fields)
query AdminListQuestions @auth(level: NO_ACCESS) {
  questions(orderBy: { createdAt: DESC }, limit: 500) {
    id
    questionText
    questionType
    difficulty
    domain
    formulaRef
    topicTags
    status
    version
    isMultiselect
    rationale
    calculation
    sourceRef
    createdAt
    answerChoices_on_question(orderBy: { position: ASC }) {
      id
      letter
      choiceText
      isCorrect
      explanation
      position
    }
  }
}

# Lightweight question list for question bank table (no answer choices, paginated)
query AdminListQuestionsPage($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
