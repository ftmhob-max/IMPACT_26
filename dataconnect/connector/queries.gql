# ─── Glossary ─────────────────────────────────────────────────────────────────

# All terms (published + draft) — admin only, called server-side
query AdminListGlossaryTerms @auth(level: NO_ACCESS) {
  glossaryTerms(orderBy: { term: ASC }) {
    id
    term
    definition
    fullDefinition
    domain
    category
    example
    relatedTerms
    isPublished
    sourceDocument
    createdBy { id fullName }
    createdAt
    updatedAt
  }
}

# Only published terms — learner endpoint, called server-side
query ListPublishedGlossaryTerms @auth(level: NO_ACCESS) {
  glossaryTerms(where: { isPublished: { eq: true } }, orderBy: { term: ASC }) {
    id
    term
    definition
    fullDefinition
    domain
    category
    example
    relatedTerms
    sourceDocument
    createdAt
    updatedAt
  }
}

# All notes for a given user (optionally filtered by term in API layer)
query GetGlossaryNotesForUser($userId: String!) @auth(level: NO_ACCESS) {
  glossaryNotes(where: { user: { id: { eq: $userId } } }, orderBy: { updatedAt: DESC }) {
    id
    note
    term { id }
    createdAt
    updatedAt
  }
}

# Single note for a specific user + term (for upsert check)
query GetGlossaryNoteForUserTerm($userId: String!, $termId: UUID!) @auth(level: NO_ACCESS) {
  glossaryNotes(
    where: { user: { id: { eq: $userId } }, term: { id: { eq: $termId } } }
    limit: 1
  ) {
    id
    note
    updatedAt
  }
}

# ─── Lesson notes (learner) ───────────────────────────────────────────────────

# All lesson notes for a user, newest first
query GetLessonNotesForUser($userId: String!) @auth(level: NO_ACCESS) {
  lessonNotes(where: { user: { id: { eq: $userId } } }, orderBy: { updatedAt: DESC }) {
    id
    lessonId
    lessonTitle
    content
    createdAt
    updatedAt
  }
}

# Single note for a specific user + lesson (for upsert check)
query GetLessonNoteForUserLesson($userId: String!, $lessonId: UUID!) @auth(level: NO_ACCESS) {
  lessonNotes(
    where: { user: { id: { eq: $userId } }, lessonId: { eq: $lessonId } }
    limit: 1
  ) {
    id
    content
    updatedAt
  }
}

# ─── Favorites ────────────────────────────────────────────────────────────────

query GetUserFavorites($userId: String!) @auth(level: NO_ACCESS) {
  userFavorites(where: { user: { id: { eq: $userId } } }, orderBy: { createdAt: DESC }) {
    itemType
    itemId
    createdAt
  }
}

query GetUserFavoritesByType($userId: String!, $itemType: String!) @auth(level: NO_ACCESS) {
  userFavorites(
    where: { user: { id: { eq: $userId } }, itemType: { eq: $itemType } }
    orderBy: { createdAt: DESC }
  ) {
    itemType
    itemId
    createdAt
  }
}

# ─── Custom Domains ───────────────────────────────────────────────────────────

query ListCustomDomains @auth(level: NO_ACCESS) {
  customDomains(orderBy: { createdAt: ASC }) {
    id
    name
  }
}

# ─── Cohorts / Classes (admin + instructor, server-only) ──────────────────────

# All cohorts with owner and membership/instructor rows for counts (admin scope).
query AdminListCohorts @auth(level: NO_ACCESS) {
  cohorts(orderBy: { createdAt: DESC }) {
    id
    name
    description
    archivedAt
    createdAt
    updatedAt
    createdBy { id email fullName }
    cohortMemberships_on_cohort { user { id } }
    cohortInstructors_on_cohort { instructor { id } }
  }
}

# Cohorts an instructor owns (createdBy) plus cohorts they are assigned to as a
# co-instructor. Results are merged/deduped in TypeScript.
query ListCohortsForInstructor($instructorId: String!) @auth(level: NO_ACCESS) {
  cohorts(
    where: { createdBy: { id: { eq: $instructorId } } }
    orderBy: { createdAt: DESC }
  ) {
    id
    name
    description
    archivedAt
    createdAt
    updatedAt
    createdBy { id email fullName }
    cohortMemberships_on_cohort { user { id } }
    cohortInstructors_on_cohort { instructor { id } }
  }
  cohortInstructors(where: { instructor: { id: { eq: $instructorId } } }) {
    cohort {
      id
      name
      description
      archivedAt
      createdAt
      updatedAt
      createdBy { id email fullName }
      cohortMemberships_on_cohort { user { id } }
      cohortInstructors_on_cohort { instructor { id } }
    }
  }
}

# Full detail for one cohort: owner, learner members, and co-instructors.
query GetCohortDetail($cohortId: UUID!) @auth(level: NO_ACCESS) {
  cohort(id: $cohortId) {
    id
    name
    description
    archivedAt
    createdAt
    updatedAt
    createdBy { id email fullName }
  }
  cohortMemberships(
    where: { cohort: { id: { eq: $cohortId } } }
    orderBy: { joinedAt: DESC }
  ) {
    joinedAt
    user { id email fullName role }
  }
  cohortInstructors(where: { cohort: { id: { eq: $cohortId } } }) {
    assignedAt
    instructor { id email fullName role }
  }
}

# Member user IDs only — used to derive analytics scope.
query GetCohortMemberIds($cohortId: UUID!) @auth(level: NO_ACCESS) {
  cohortMemberships(where: { cohort: { id: { eq: $cohortId } } }) {
    user { id }
  }
}

# Completed attempts scoped to a set of learner IDs (same shape as AdminCohortStats).
query GetCohortAttempts($userIds: [String!]!) @auth(level: NO_ACCESS) {
  quizAttempts(
    where: { user: { id: { in: $userIds } }, status: { eq: "completed" } }
    orderBy: { completedAt: DESC }
  ) {
    id
    user { id email fullName }
    quiz { id title }
    scorePct
    passed
    completedAt
    quizResponses_on_attempt {
      isCorrect
      pointsEarned
      pointsPossible
      question { id domain difficulty questionText topicTags }
    }
  }
}

# Course/lesson progress and daily activity for a set of learner IDs — drives the
# engagement panel (completion %, lessons completed, streaks, last active).
query GetCohortEngagement($userIds: [String!]!) @auth(level: NO_ACCESS) {
  userCourseProgresses(where: { user: { id: { in: $userIds } } }) {
    user { id }
    course { id title }
    enrolledAt
    completedAt
    lastAccessedAt
  }
  userLessonProgresses(where: { user: { id: { in: $userIds } } }) {
    user { id }
    lesson { id }
    status
    completedAt
  }
  dailyActivities(where: { user: { id: { in: $userIds } } }) {
    user { id }
    activityDate
    lastActivityAt
  }
}

# Everything needed for a single learner drill-down page.
query GetLearnerProgressDetail($userId: String!) @auth(level: NO_ACCESS) {
  users(where: { id: { eq: $userId } }, limit: 1) {
    id
    email
    fullName
    role
    createdAt
  }
  quizAttempts(
    where: { user: { id: { eq: $userId } }, status: { eq: "completed" } }
    orderBy: { completedAt: DESC }
  ) {
    id
    quiz { id title passingScore }
    scorePct
    scoreRaw
    scoreMax
    passed
    startedAt
    completedAt
    quizResponses_on_attempt {
      isCorrect
      pointsEarned
      pointsPossible
      question { domain }
    }
  }
  userCourseProgresses(where: { user: { id: { eq: $userId } } }) {
    course { id title }
    enrolledAt
    completedAt
    lastAccessedAt
  }
  userLessonProgresses(where: { user: { id: { eq: $userId } } }) {
    lesson { id }
    status
    completedAt
  }
  dailyActivities(
    where: { user: { id: { eq: $userId } } }
    orderBy: { activityDate: DESC }
    limit: 1000
  ) {
    activityDate
    lastActivityAt
  }
}

# Teacher-side attempt review — full correct-answer detail, authorized by cohort
# scope in the API route (not by learner ownership).
query AdminGetAttemptReview($attemptId: UUID!) @auth(level: NO_ACCESS) {
  quizAttempt(id: $attemptId) {
    id
    user { id }
    quiz { id title passingScore }
    status
    questionOrder
    scoreRaw
    scoreMax
    scorePct
    passed
    startedAt
    completedAt
  }
  quizResponses(where: { attempt: { id: { eq: $attemptId } } }) {
    question {
      id
      questionText
      domain
      difficulty
      rationale
      calculation
      sourceRef
      answerChoices_on_question {
        letter
        choiceText
        isCorrect
        explanation
        position
      }
    }
    selectedLetters
    isCorrect
    pointsEarned
    pointsPossible
  }
}

