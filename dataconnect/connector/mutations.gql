  question_insert(data: {
    id: $id
    questionText: $questionText
    questionType: $questionType
    difficulty: $difficulty
    domain: $domain
    formulaRef: $formulaRef
    topicTags: $topicTags
    status: $status
    isMultiselect: $isMultiselect
    rationale: $rationale
    calculation: $calculation
    sourceRef: $sourceRef
    createdBy: { id: $createdById }
  })
}

mutation UpdateQuestion($id: UUID!, $questionText: String, $difficulty: String, $domain: String, $formulaRef: String, $rationale: String, $calculation: String, $sourceRef: String) @auth(level: NO_ACCESS) {
