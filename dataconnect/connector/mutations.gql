# ─── Progress tracking (learner — own records only) ───────────────────────────

mutation EnrollInCourse($userId: String!, $courseId: UUID!) @auth(level: NO_ACCESS) {
  userCourseProgress_insert(data: {
    user: { id: $userId }
    course: { id: $courseId }
  })
}

mutation UpsertLessonProgress($userId: String!, $lessonId: UUID!, $status: String!, $videoPositionSeconds: Int) @auth(level: NO_ACCESS) {
  userLessonProgress_upsert(data: {
    user: { id: $userId }
    lesson: { id: $lessonId }
    status: $status
    videoPositionSeconds: $videoPositionSeconds
  })
}

# ─── Quiz attempt lifecycle (server-only via Admin SDK) ───────────────────────
# These mutations are called from Next.js API routes using the Admin SDK.
# NO_ACCESS means client SDK cannot call them directly.

mutation CreateQuizAttempt($userId: String!, $quizId: UUID!, $questionOrder: String!) @auth(level: NO_ACCESS) {
  quizAttempt_insert(data: {
    user: { id: $userId }
    quiz: { id: $quizId }
    status: "in_progress"
    questionOrder: $questionOrder
  })
}

mutation UpsertQuizResponse($attemptId: UUID!, $questionId: UUID!, $selectedLetters: String!, $isCorrect: Boolean, $pointsEarned: Float, $pointsPossible: Float, $answeredAt: Date) @auth(level: NO_ACCESS) {
  quizResponse_upsert(data: {
    attempt: { id: $attemptId }
    question: { id: $questionId }
    selectedLetters: $selectedLetters
    isCorrect: $isCorrect
    pointsEarned: $pointsEarned
    pointsPossible: $pointsPossible
    answeredAt: $answeredAt
  })
}

mutation CompleteQuizAttempt($id: UUID!, $scoreRaw: Float!, $scoreMax: Float!, $scorePct: Float!, $passed: Boolean!) @auth(level: NO_ACCESS) {
  quizAttempt_update(id: $id, data: {
    status: "completed"
    scoreRaw: $scoreRaw
    scoreMax: $scoreMax
    scorePct: $scorePct
    passed: $passed
  })
}

mutation MarkAnsweredAt($attemptId: UUID!, $questionId: UUID!, $answeredAt: Date!) @auth(level: NO_ACCESS) {
  quizResponse_update(key: { attemptId: $attemptId, questionId: $questionId }, data: { answeredAt: $answeredAt })
}

