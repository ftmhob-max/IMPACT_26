# ─── User management ─────────────────────────────────────────────────────────

# Called from Clerk/Firebase Auth webhook on user creation
mutation CreateUser($id: String!, $email: String!, $fullName: String) @auth(level: NO_ACCESS) {
  user_insert(data: {
    id: $id
    email: $email
    fullName: $fullName
    role: "learner"
  })
}

mutation UpdateUserRole($id: String!, $role: String!) @auth(level: NO_ACCESS) {
  user_update(id: $id, data: { role: $role })
}

# ─── Course management (admin/instructor only) ────────────────────────────────

mutation CreateCourse($id: UUID!, $slug: String!, $title: String!, $description: String, $thumbnailUrl: String, $createdById: String!) @auth(level: NO_ACCESS) {
  course_insert(data: {
    id: $id
    slug: $slug
    title: $title
    description: $description
    thumbnailUrl: $thumbnailUrl
    status: "draft"
    createdBy: { id: $createdById }
  })
}

mutation UpdateCourse($id: UUID!, $title: String, $description: String, $thumbnailUrl: String, $status: String, $isPublished: Boolean, $updatedById: String, $publishedAt: Date) @auth(level: NO_ACCESS) {
  course_update(id: $id, data: {
    title: $title
    description: $description
    thumbnailUrl: $thumbnailUrl
    status: $status
    isPublished: $isPublished
    updatedBy: { id: $updatedById }
    publishedAt: $publishedAt
  })
}

mutation CreateModule($id: UUID!, $courseId: UUID!, $title: String!, $position: Int!) @auth(level: NO_ACCESS) {
  module_insert(data: {
    id: $id
    course: { id: $courseId }
    title: $title
    position: $position
  })
}

mutation UpdateModule($id: UUID!, $title: String, $description: String, $learningObjectives: String, $prerequisiteModuleIds: String, $position: Int, $status: String) @auth(level: NO_ACCESS) {
  module_update(id: $id, data: {
